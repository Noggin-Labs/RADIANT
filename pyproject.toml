[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radiant-eval"
version = "0.1.0"
description = "A reproducible evaluation framework for evidence-sensitive mathematical diagnosis in LLM tutors."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Noggin Labs" }]
keywords = ["LLM", "AI tutoring", "mathematics", "evaluation", "diagnosis"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
api = ["httpx>=0.27"]
test = ["pytest>=8.0", "coverage>=7.0"]
all = ["httpx>=0.27", "pytest>=8.0", "coverage>=7.0"]

[project.scripts]
radiant = "radiant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
